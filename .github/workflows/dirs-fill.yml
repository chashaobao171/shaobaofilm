name: Directors Filmography Fill

# 按「导演谱系」补齐 74 位导演的院线长片
# collect：拉取候选 → 提交 dirs-fill-candidates.json（待人工审阅）
# apply  ：按清单合并进 films-data.js → 重算图谱计数 → 不变量自检 → 提交
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'collect = 生成待审清单；apply = 按清单合并入库；posters = 把远程海报下载到本地'
        required: true
        default: collect
        type: choice
        options:
          - collect
          - apply
          - posters

permissions:
  contents: write

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run dirs fill
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node tools/_dirs_fill.js ${{ inputs.mode }}

      - name: Recount + verify (apply)
        if: inputs.mode == 'apply'
        run: |
          node tools/_recount_taxonomy.js
          node tools/_verify_data.js

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ inputs.mode }}" = "apply" ]; then
            git add films-data.js taxonomy-data.js .last_merge_count.txt dirs-fill-candidates.json
            MSG="导演作品补全：按待审清单合并 TMDB 数据（院线长片 / 6.5+）"
          elif [ "${{ inputs.mode }}" = "posters" ]; then
            git add films-data.js posters
            if [ -f .poster_failed.txt ]; then git add .poster_failed.txt; fi
            MSG="导演作品补全：海报本地化（TMDB 远程地址下载到 posters/）"
          else
            git add dirs-fill-candidates.json
            COUNT=$(node -e 'const d=require("./dirs-fill-candidates.json");console.log(d.films.length)')
            MSG="导演作品补全：生成待审候选清单（${COUNT} 部候选）"
          fi
          git diff --staged --quiet || git commit -m "$MSG"
          git push

      - name: Upload candidates artifact (collect)
        if: inputs.mode == 'collect'
        uses: actions/upload-artifact@v4
        with:
          name: dirs-fill-candidates
          path: dirs-fill-candidates.json
          retention-days: 30