name: Discover New Films

on:
  schedule:
    # Run every Monday at 2 AM UTC (10 AM Beijing time)
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Discover new films
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          # 热门/趋势门槛（评分 / 评价人数），可按需调整
          TMDB_MIN_RATING: '7.0'
          TMDB_MIN_VOTES: '100'
          # 院线新片通道门槛：刚上映票数少，允许 0 票，只看较低评分线
          TMDB_NEW_MIN_RATING: '5.0'
          TMDB_NEW_MIN_VOTES: '0'
          TMDB_NEW_MAX: '20'
        run: node tools/_tmdb_discover.js

      - name: Discover Douban hot/new/classic films
        env:
          # 热门/最新榜之外，按豆瓣高分榜补齐经典老片，单次最多补 30 部
          DOUBAN_TOP_PAGES: '5'
          DOUBAN_TOP_MAX: '30'
        run: node tools/_douban_discover.js

      - name: Merge new films into films-data.js
        run: node tools/_tmdb_merge.js

      - name: Download posters for new films
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node tools/_poster_download.js

      - name: Rebuild taxonomy counts
        run: node tools/_recount_taxonomy.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add films-data.js taxonomy-data.js _tmdb_discovered.json posters
          git add -A _douban_discovered.json || true
          git diff --staged --quiet || (git commit -m "Auto: Discover new films (TMDB + Douban)" && git push)
