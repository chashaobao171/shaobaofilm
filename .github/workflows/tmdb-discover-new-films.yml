name: Discover New Films from TMDB

on:
  schedule:
    # Run every Monday at 2 AM UTC (10 AM Beijing time)
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Discover new films
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node _tmdb_discover.js

      - name: Merge new films into films-data.js
        run: node _tmdb_merge.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add films-data.js _tmdb_discovered.json
          git diff --staged --quiet || (git commit -m "Auto: Discover new films from TMDB" && git push)
