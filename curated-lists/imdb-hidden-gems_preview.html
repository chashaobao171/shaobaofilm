<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview: IMDb Hidden Gems</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      margin: 20px; 
      background: #f5f5f5;
      color: #333;
    }
    h1 { 
      color: #333; 
      margin-bottom: 20px;
      font-size: 28px;
    }
    .stats { 
      background: #fff; 
      padding: 20px; 
      border-radius: 8px; 
      margin-bottom: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .stats p { 
      font-size: 16px; 
      line-height: 1.8;
      margin-bottom: 8px;
    }
    .stats .highlight {
      font-weight: bold;
      color: #2196F3;
    }
    .film-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
      gap: 20px;
      margin-bottom: 40px;
    }
    .film-card { 
      background: #fff; 
      border-radius: 8px; 
      overflow: hidden; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .film-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }
    .film-card img { 
      width: 100%; 
      display: block;
      aspect-ratio: 2/3;
      object-fit: cover;
      background: #eee;
    }
    .film-info { 
      padding: 12px; 
    }
    .film-title { 
      font-weight: bold; 
      font-size: 14px; 
      margin-bottom: 6px;
      line-height: 1.3;
      min-height: 36px;
    }
    .film-meta { 
      font-size: 12px; 
      color: #666;
      margin-bottom: 4px;
    }
    .rating { 
      color: #f90; 
      font-weight: bold;
      font-size: 14px;
    }
    .genres {
      font-size: 11px;
      color: #999;
      margin-top: 6px;
      line-height: 1.4;
    }
    .failed-section {
      background: #fff3cd;
      padding: 20px;
      border-radius: 8px;
      margin-top: 30px;
      border-left: 4px solid #ffc107;
    }
    .failed-section h2 {
      color: #856404;
      margin-bottom: 15px;
      font-size: 20px;
    }
    .failed-list {
      list-style: none;
    }
    .failed-item {
      padding: 8px 0;
      border-bottom: 1px solid #e0e0e0;
      font-size: 14px;
    }
    .failed-item:last-child {
      border-bottom: none;
    }
    .reason {
      color: #d32f2f;
      font-size: 12px;
      margin-left: 10px;
    }
  </style>
</head>
